name: Repository boundaries

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out integration
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          path: workspace/aosedge-sdv-demo
          fetch-depth: 0
      - name: Check out CARLA ego runtime
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: alexmaninblack/carla-ego-runtime
          ref: 2e3d1164d491dac25e212f59315057deca0bf3d8
          path: workspace/carla-ego-runtime
      - name: Check out vehicle platform
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: alexmaninblack/aos-vehicle-platform
          ref: 92a2138813983cb1c029fd3e61bd90b68241af63
          path: workspace/aos-vehicle-platform
          # Platform provenance tests inspect introducing commits and base blobs.
          fetch-depth: 0
      - name: Check out Brake Health service
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: alexmaninblack/brake-health-service
          ref: 5aa652fda603e7621043961331e58236b19204e9
          path: workspace/brake-health-service
      - name: Check out Tire source for cross-repository documentation links
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: alexmaninblack/tire-health-service
          ref: f0a0f6edadb51aa338775d157aa3bde28f5b76f4
          path: workspace/tire-health-service
      - name: Check out Brake backend for cross-repository documentation links
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: alexmaninblack/brake-health-cloud
          ref: 7c64adf7b3d99535ecc7c8cbe468bc527cbcdc12
          path: workspace/brake-health-cloud
      - name: Check out Tire backend for cross-repository documentation links
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: alexmaninblack/tire-health-cloud
          ref: ea2d6deec9b704cb866d362eaefc9d87356ddeb5
          path: workspace/tire-health-cloud
      - name: Install image-metadata fixture dependency
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qemu-utils
      - name: Install pinned source-gate dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/reuse"
          "$RUNNER_TEMP/reuse/bin/pip" install 'reuse==5.1.1' 'charset-normalizer==3.4.4' 'PyYAML==6.0.3' 'packaging==26.3'
          echo "$RUNNER_TEMP/reuse/bin" >> "$GITHUB_PATH"
      - name: Validate resolved release definition
        run: python3 -B workspace/aosedge-sdv-demo/scripts/validate-release-definition
      - name: Resolve build-only profile without host dependencies
        run: python3 -B workspace/aosedge-sdv-demo/lab plan --profile developer
      - name: Qualify clean repository boundaries
        run: >-
          workspace/aosedge-sdv-demo/scripts/qualify-repository-boundaries
          --workspace-root workspace
          --reuse-command "$RUNNER_TEMP/reuse/bin/reuse"
