name: Repository boundaries

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out integration
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          path: workspace/aosedge-sdv-demo
          fetch-depth: 0
      - name: Check out CARLA ego runtime
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: alexmaninblack/carla-ego-runtime
          ref: 453b7948006d0264b0cede17816aaf551485b3cf
          path: workspace/carla-ego-runtime
      - name: Check out vehicle platform
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: alexmaninblack/aos-vehicle-platform
          ref: 50a66b73dfc11361c2b8457934b3a0d4a7118dfe
          path: workspace/aos-vehicle-platform
          # Platform provenance tests inspect introducing commits and base blobs.
          fetch-depth: 0
      - name: Check out Brake Health service
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: alexmaninblack/brake-health-service
          ref: 230cdd4515d1be94ef342197ff56f6b76498aff2
          path: workspace/brake-health-service
      - name: Check out Tire source for cross-repository documentation links
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: alexmaninblack/tire-health-service
          ref: 8639b57535e32e3fb2ce68f10794c90d39bb5ae5
          path: workspace/tire-health-service
      - name: Install image-metadata fixture dependency
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qemu-utils
      - name: Install pinned source-gate dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/reuse"
          "$RUNNER_TEMP/reuse/bin/pip" install 'reuse==5.1.1' 'charset-normalizer==3.4.4' 'PyYAML==6.0.3'
          echo "$RUNNER_TEMP/reuse/bin" >> "$GITHUB_PATH"
      - name: Qualify clean repository boundaries
        run: >-
          workspace/aosedge-sdv-demo/scripts/qualify-repository-boundaries
          --workspace-root workspace
          --reuse-command "$RUNNER_TEMP/reuse/bin/reuse"
