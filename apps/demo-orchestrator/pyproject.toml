[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aosedge-demo-orchestrator"
version = "0.1.0"
description = "Headless lifecycle operations for the AosEdge SDV demo"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "maninblack" }]
dependencies = []

[project.scripts]
democtl = "aosedge_demo_orchestrator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aosedge_demo_orchestrator = ["native/*.swift"]
