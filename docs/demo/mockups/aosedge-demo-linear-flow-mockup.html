.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);

  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {

  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {

  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

      background: light-dark(#f0f3f7, #202b3f);

      const stageLabels = [&quot;Prepared&quot;, &quot;Published&quot;, &quot;Test authorized&quot;, &quot;Test accepted&quot;, &quot;Production authorized&quot;, &quot;Production active&quot;];

      }
      detailsCloseIcon.textContent = &quot;×&quot;;

      function currentVersionIndex(teamKey = selectedTeam) {

      }

      function currentRelease(teamKey = selectedTeam) {
        return teams[teamKey].versions[currentVersionIndex(teamKey)];
      }

      function currentStage(teamKey = selectedTeam) {
        const lane = workstreams[teamKey];

      }

      function setCurrentStage(value) {

      function targetForStage(stage) {

      }

      function dependencyState(release, target) {
        if (!release.requiredVdp) return { ready: true, actual: installed[target].platform };
        return { ready: installed[target].platform &gt;= release.requiredVdp, actual: installed[target].platform };
      }

      function stepDefinitions(teamKey, release) {
        const team = teams[teamKey];
        return [
          [`${team.shortLabel} action`, &quot;Published ✓&quot;, `${team.label} publishes ${release.name}`, &quot;The already prepared artifact is signed and submitted to AosCloud.&quot;, &quot;Sign &amp; submit candidate&quot;],

      function renderTeamStatuses() {
        teamStatusNodes.forEach((node) =&gt; {

      function renderDependency(release, stage) {
        if (!release.requiredVdp) {
          dependencyNote.hidden = true;
          return;

        const target = targetForStage(stage);

        dependencyNote.hidden = dependency.ready;

          const actual = dependency.actual ? `VDP v${dependency.actual}` : &quot;no VDP component&quot;;

          dependencyCopy.textContent = `${release.compact} requires VDP v${release.requiredVdp}. ${vehicle} currently has ${actual}. The candidate can be submitted, but deployment is blocked until the required Vehicle Data Platform Component is active on this vehicle.`;
        }

        const team = teams[selectedTeam];

        renderVersionButtons();

      function updateConnectivity() {

      function openDetails(stepIndex, trigger) {
        const detail = buildDetails(stepIndex);
        detailsTrigger = trigger;
        detailsTitle.textContent = detail.title;
        detailsContext.textContent = detail.context;
        detailsBody.replaceChildren();
        detail.groups.forEach((group) =&gt; {
          const section = document.createElement(&quot;section&quot;);
          section.className = &quot;details-group&quot;;
          const heading = document.createElement(&quot;h4&quot;);
          heading.textContent = group.title;
          const list = document.createElement(&quot;dl&quot;);
          group.items.forEach(([label, value]) =&gt; {
            const term = document.createElement(&quot;dt&quot;);
            const description = document.createElement(&quot;dd&quot;);
            term.textContent = label;
            description.textContent = value;
            list.append(term, description);
          });
          section.append(heading, list);

    function openDetails(index, trigger) {
      const model = selectedTeam === &quot;brake&quot; ? brakeDetailModels[index] : genericDetailModels(teamModels[selectedTeam])[index];
      detailsTrigger = trigger;
      detailsTitle.textContent = model.title;
      detailsContext.textContent = model.context;
      detailsBody.replaceChildren();

      model.groups.forEach((group) =&gt; {
        const section = document.createElement(&quot;section&quot;);
        section.className = &quot;details-group&quot;;
        const heading = document.createElement(&quot;h4&quot;);
        heading.textContent = group.title;
        const list = document.createElement(&quot;dl&quot;);
        group.items.forEach(([label, value]) =&gt; {
          const term = document.createElement(&quot;dt&quot;);
          const description = document.createElement(&quot;dd&quot;);
          term.textContent = label;
          description.textContent = value;
          list.append(term, description);
        });
        section.append(heading, list);
        detailsBody.append(section);
      });

      detailsOverlay.hidden = false;
      story.style.overflow = &quot;hidden&quot;;
      root.querySelector(&quot;.details-close-icon&quot;).focus();
    }

    function closeDetails() {
      if (detailsOverlay.hidden) return;
      detailsOverlay.hidden = true;
      story.style.overflow = &quot;&quot;;
      if (detailsTrigger) detailsTrigger.focus();
    }

    function renderScenario() {
      const model = teamModels[selectedTeam];
      chapterTitle.textContent = model.chapterTitle;
      teamButtons.forEach((button) =&gt; button.setAttribute(&quot;aria-pressed&quot;, String(button.dataset.team === selectedTeam)));

      actions.forEach((action, index) =&gt; {
        const step = model.steps[index];
        const button = action.querySelector(&quot;.scenario-action-button&quot;);
        const state = action.querySelector(&quot;.scenario-state&quot;);
        const copy = action.querySelector(&quot;.scenario-copy&quot;);
        const isDone = index &lt; currentStep;
        const isCurrent = index === currentStep &amp;&amp; currentStep &lt; actions.length;

        action.dataset.owner = step[0];
        action.dataset.done = step[1];
        copy.querySelector(&quot;strong&quot;).textContent = step[2];
        copy.querySelector(&quot;span&quot;).textContent = step[3];
        if (!(activeDriveStep === index &amp;&amp; drivePhase !== &quot;idle&quot;)) button.textContent = step[4];
        action.classList.toggle(&quot;done&quot;, isDone);
        action.classList.toggle(&quot;current&quot;, isCurrent);
        button.hidden = !isCurrent;
        state.hidden = !isDone;
        state.textContent = isDone ? action.dataset.done : &quot;&quot;;
      });

    }

    function resetDriveEvidence() {
      if (driveTimer) window.clearTimeout(driveTimer);
      driveTimer = null;
      drivePhase = &quot;idle&quot;;
      activeDriveStep = null;
      functionBackend.hidden = true;
      if (vehicleOnline) {
        carlaCaption.textContent = &quot;CARLA · LIVE&quot;;
        telemetryCaption.textContent = &quot;Engineering signals · LIVE&quot;;
      } else {
        carlaCaption.textContent = &quot;Vehicle running · EXTERNAL CONNECTIVITY OFF&quot;;
        telemetryCaption.textContent = &quot;Engineering signals · LOCAL SERVICES ACTIVE&quot;;
      }
    }

    function showDriveEvidence(stepIndex) {
      const model = teamModels[selectedTeam];
      const production = stepIndex === 4;
      const action = actions[stepIndex];
      const button = action.querySelector(&quot;.scenario-action-button&quot;);
      const vehicle = production ? &quot;Production Vehicle&quot; : &quot;Test Vehicle&quot;;

      if (drivePhase === &quot;ready&quot; &amp;&amp; activeDriveStep === stepIndex) {
        resetDriveEvidence();
        currentStep += 1;
        teamStates[selectedTeam] = currentStep;
        renderScenario();
        return;
      }

      activeDriveStep = stepIndex;
      drivePhase = &quot;running&quot;;
      functionBackend.hidden = false;
      backendTitle.textContent = model.backendTitle;
      backendVehicle.textContent = `${vehicle} · ${model.artifact}`;
      backendUnit.textContent = vehicle;
      backendService.textContent = `${model.artifact} · Active`;
      backendConnectivity.textContent = vehicleOnline ? &quot;Vehicle ↔ Backend · Online&quot; : &quot;Vehicle ↔ External world · Offline&quot;;
      backendLiveState.textContent = vehicleOnline ? &quot;Receiving live evidence&quot; : &quot;Vehicle offline&quot;;
      backendEventTitle.textContent = &quot;Waiting for vehicle event&quot;;
      backendEventCopy.textContent = vehicleOnline ? &quot;The same event will be visible in CARLA, engineering signals and this evidence view.&quot; : &quot;Cloud delivery is unavailable; the on-vehicle function continues locally.&quot;;
      backendEventTime.textContent = &quot;t = —&quot;;
      backendDetection.textContent = &quot;Scenario running&quot;;
      backendMessage.textContent = vehicleOnline ? &quot;Waiting&quot; : &quot;Unavailable — vehicle offline&quot;;
      backendEvidence.textContent = vehicleOnline ? &quot;Collecting&quot; : &quot;Local operation under test&quot;;
      carlaCaption.textContent = vehicleOnline ? `${vehicle} · ${model.scenarioCaption}` : `${vehicle} · RUNNING LOCALLY`;
      telemetryCaption.textContent = vehicleOnline ? &quot;Engineering signals · recording&quot; : &quot;Engineering signals · LOCAL ANALYSIS ACTIVE&quot;;
      button.textContent = &quot;Drive running…&quot;;
      button.disabled = true;
      functionBackend.scrollIntoView({ block: &quot;nearest&quot;, behavior: window.matchMedia(&quot;(prefers-reduced-motion: reduce)&quot;).matches ? &quot;auto&quot; : &quot;smooth&quot; });

      driveTimer = window.setTimeout(() =&gt; {
        backendEventTitle.textContent = vehicleOnline ? model.eventTitle : model.offlineEventTitle;
        backendEventCopy.textContent = vehicleOnline ? model.eventCopy : &quot;No event reaches the cloud backend, while the local vehicle service and driver-facing recommendation remain active.&quot;;
        backendEventTime.textContent = model.eventTime;
        backendDetection.textContent = model.detection;
        backendMessage.textContent = vehicleOnline ? model.cloudMessage : &quot;Not delivered — vehicle offline&quot;;
        backendEvidence.textContent = vehicleOnline ? (production ? &quot;Demonstrated&quot; : &quot;Ready for OEM review&quot;) : &quot;Offline behavior demonstrated&quot;;
        backendLiveState.textContent = vehicleOnline ? &quot;Evidence ready&quot; : &quot;Local service active&quot;;
        carlaCaption.textContent = vehicleOnline ? `${vehicle} · EVENT AT ${model.eventTime.replace(&quot;t = &quot;, &quot;&quot;)}` : `${vehicle} · RUNNING WITHOUT CLOUD`;
        telemetryCaption.textContent = vehicleOnline ? `Engineering signals · ${model.telemetryCaption}` : `Engineering signals · ${model.offlineEventTitle.toUpperCase()}`;
        button.disabled = false;
        button.replaceChildren(document.createTextNode(production ? &quot;Complete demonstration&quot; : &quot;Continue to OEM review&quot;));
        drivePhase = &quot;ready&quot;;
      }, 1400);
    }

    function updateConnectivity() {
      connectivityControl.classList.toggle(&quot;offline&quot;, !vehicleOnline);
      connectivityState.textContent = vehicleOnline ? &quot;Connected&quot; : &quot;Offline&quot;;
      connectivityButton.textContent = vehicleOnline ? &quot;Simulate connectivity loss&quot; : &quot;Restore connectivity&quot;;
      backendConnectivity.textContent = vehicleOnline ? &quot;Vehicle ↔ Backend · Online&quot; : &quot;Vehicle ↔ External world · Offline&quot;;

      if (!functionBackend.hidden) {
        backendLiveState.textContent = vehicleOnline ? (drivePhase === &quot;ready&quot; ? &quot;Evidence ready&quot; : &quot;Receiving live evidence&quot;) : &quot;Vehicle offline&quot;;
        backendMessage.textContent = vehicleOnline ? (drivePhase === &quot;ready&quot; ? teamModels[selectedTeam].cloudMessage : &quot;Waiting&quot;) : &quot;No new cloud events&quot;;
        backendEventCopy.textContent = vehicleOnline ? &quot;Vehicle connectivity restored; cloud evidence can continue.&quot; : &quot;The backend receives no new events. CARLA, KUKSA and on-vehicle services continue locally.&quot;;
      }

      if (vehicleOnline) {
        if (functionBackend.hidden) {
          carlaCaption.textContent = &quot;CARLA · LIVE&quot;;
          telemetryCaption.textContent = &quot;Engineering signals · LIVE&quot;;
        }
      } else {
        carlaCaption.textContent = &quot;Vehicle running · EXTERNAL CONNECTIVITY OFF&quot;;
        telemetryCaption.textContent = &quot;Engineering signals · LOCAL SERVICES ACTIVE&quot;;
      }
    }

    actions.forEach((action, index) =&gt; {
      action.querySelector(&quot;.scenario-action-button&quot;).addEventListener(&quot;click&quot;, () =&gt; {
        if (index !== currentStep) return;
        if (index === 2 || index === 4) {
          showDriveEvidence(index);
          return;
        }
        resetDriveEvidence();
        currentStep += 1;
        teamStates[selectedTeam] = currentStep;
        renderScenario();
        if (currentStep &lt; actions.length &amp;&amp; story.scrollHeight &gt; story.clientHeight) {
          const target = actions[currentStep];
          const targetTop = target.getBoundingClientRect().top - story.getBoundingClientRect().top + story.scrollTop;
          const nextTop = targetTop - (story.clientHeight - target.offsetHeight) / 2;
          const reducedMotion = window.matchMedia(&quot;(prefers-reduced-motion: reduce)&quot;).matches;
          story.scrollTo({ top: Math.max(0, nextTop), behavior: reducedMotion ? &quot;auto&quot; : &quot;smooth&quot; });
        }
      });
      action.querySelector(&quot;.scenario-details-button&quot;).addEventListener(&quot;click&quot;, (event) =&gt; {
        openDetails(index, event.currentTarget);
      });
    });

    teamButtons.forEach((button) =&gt; {
      button.addEventListener(&quot;click&quot;, () =&gt; {
        if (button.dataset.team === selectedTeam) return;
        teamStates[selectedTeam] = currentStep;
        resetDriveEvidence();
        selectedTeam = button.dataset.team;
        currentStep = teamStates[selectedTeam];
        renderScenario();
        updateConnectivity();
        story.scrollTo({ top: 0, behavior: &quot;auto&quot; });
      });
    });

    connectivityButton.addEventListener(&quot;click&quot;, () =&gt; {
      vehicleOnline = !vehicleOnline;
      updateConnectivity();
    });

    closeDetailsButtons.forEach((button) =&gt; button.addEventListener(&quot;click&quot;, closeDetails));
    root.addEventListener(&quot;keydown&quot;, (event) =&gt; {
      if (event.key === &quot;Escape&quot; &amp;&amp; !detailsOverlay.hidden) closeDetails();
    });

    updateConnectivity();
    renderScenario();
  })();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
